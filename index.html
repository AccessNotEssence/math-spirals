<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centripetal Spirals - Distinct Mathematical Behaviors</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #050508; color: #FFF; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        #ui { position: absolute; bottom: 30px; left: 30px; background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(8px); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; margin: 0 0 8px 0; letter-spacing: 0.5px; }
        .history { font-size: 13px; color: #A0AAB0; margin-bottom: 8px; }
        .formula { font-size: 15px; font-family: 'Courier New', Courier, monospace; font-weight: bold; padding: 6px 10px; background: rgba(255,255,255,0.05); border-radius: 6px; margin-bottom: 10px; display: inline-block; }
        .desc { font-size: 13px; color: #4FC3F7; line-height: 1.4; margin: 0; }
        .nav { position: absolute; top: 30px; right: 30px; display: flex; gap: 8px; }
        button { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 500; }
        button:hover { background: rgba(255,255,255,0.25); }
    </style>
</head>
<body>

<div id="ui">
    <h1 id="spiral-title">Initializing...</h1>
    <div class="history" id="spiral-history"></div>
    <div class="formula" id="spiral-formula"></div>
    <p class="desc" id="spiral-desc"></p>
</div>

<div class="nav">
    <button onclick="prevSpiral()">◀ PREV</button>
    <button onclick="nextSpiral()">NEXT ▶</button>
</div>

<script>
let spirals = [];
let currentSpiralIndex = 0;
let t = 0;
let points = [];
let secondaryPoints = [];

function setup() {
    createCanvas(windowWidth, windowHeight);
    
    spirals = [
        {
            title: "1. Logarithmic Spiral",
            history: "René Descartes (1638) / Jacob Bernoulli (1692)",
            formula: "r(θ) = a · e^(-bθ)",
            desc: "【Feature: Self-Similarity】Coils denser as it nears the center. Scales recursively without altering geometry (Nautilus shells, hurricanes, galaxies).",
            color: [255, 215, 0], // GOLD
            func: (t) => {
                let r = 350 * Math.exp(-0.2 * t);
                return { x: r * Math.cos(t), y: r * Math.sin(t) };
            },
            tRange: [0, 8 * Math.PI],
            tSpeed: 0.03,
            hasDual: false
        },
        {
            title: "2. Hyperbolic Spiral",
            history: "Pierre Varignon (1704) / Johann Bernoulli",
            formula: "r(θ) = a / θ",
            desc: "【Feature: Asymptotic Outer Line + Infinite Center Collapse】Approaches a horizontal asymptote at infinity, then fiercely plunges into the origin.",
            color: [0, 230, 200], // TEAL
            func: (t) => {
                let theta = t + 0.8;
                let r = 800 / theta;
                return { x: r * Math.cos(t), y: r * Math.sin(t) };
            },
            tRange: [0, 15 * Math.PI],
            tSpeed: 0.05,
            hasDual: false
        },
        {
            title: "3. Euler / Cornu Spiral (Clothoid)",
            history: "Leonhard Euler (1744) / Marie Alfred Cornu (1874)",
            formula: "κ(s) = a · s (Curvature ∝ Arc Length)",
            desc: "【Feature: Dual S-Shape Symmetry】Curvature increases linearly with distance. Crucial in railway transition curves to smooth centrifugal force.",
            color: [186, 104, 200], // PURPLE
            func: (t) => {
                let scale = 250;
                let s = t - 4;
                let x = scale * (s - Math.pow(s, 3)/6 + Math.pow(s, 5)/120);
                let y = scale * (Math.pow(s, 2)/2 - Math.pow(s, 4)/24);
                return { x: x * 0.3, y: y * 0.3 };
            },
            tRange: [0, 8],
            tSpeed: 0.02,
            hasDual: false
        },
        {
            title: "4. Archimedean Spiral",
            history: "Archimedes of Syracuse (c. 225 BC)",
            formula: "r(θ) = a + bθ",
            desc: "【Feature: Constant Separation Distance】Successive turnings have a constant separation distance. Found in vinyl records, coiled ropes, and scroll chucks.",
            color: [255, 152, 0], // ORANGE
            func: (t) => {
                let max_t = 10 * Math.PI;
                let theta = max_t - t;
                let r = 12 * theta;
                return { x: r * Math.cos(theta), y: r * Math.sin(theta) };
            },
            tRange: [0, 10 * Math.PI],
            tSpeed: 0.05,
            hasDual: false
        },
        {
            title: "5. Fermat's Spiral",
            history: "Pierre de Fermat (1636)",
            formula: "r² = a²θ (Dual Parabolic Arms)",
            desc: "【Feature: Symmetrical Parabolic Dual Arms】Symmetric about the origin with two opposing branches. Forms the mathematical basis for sunflower seed packing.",
            color: [244, 67, 54], // RED
            func: (t, isNegative = false) => {
                let max_t = 8 * Math.PI;
                let theta = max_t - t;
                let r = 45 * Math.sqrt(theta);
                if (isNegative) r = -r;
                return { x: r * Math.cos(theta), y: r * Math.sin(theta) };
            },
            tRange: [0, 8 * Math.PI],
            tSpeed: 0.04,
            hasDual: true
        }
    ];

    resetSpiral();
}

function draw() {
    background(5, 5, 8, 30);
    translate(width / 2, height / 2);

    let current = spirals[currentSpiralIndex];
    let sColor = current.color;

    // Draw reference axes
    stroke(255, 255, 255, 15);
    strokeWeight(1);
    line(-width/2, 0, width/2, 0);
    line(0, -height/2, 0, height/2);

    // Draw primary trajectory
    noFill();
    stroke(sColor[0], sColor[1], sColor[2], 200);
    strokeWeight(2.5);
    
    beginShape();
    for (let p of points) vertex(p.x, p.y);
    endShape();

    // Draw secondary arm if Fermat
    if (current.hasDual) {
        stroke(255, 255, 255, 180);
        beginShape();
        for (let p of secondaryPoints) vertex(p.x, p.y);
        endShape();
    }

    // Dynamic dot animation
    if (t <= current.tRange[1]) {
        let pos = current.func(t, false);
        points.push(pos);

        if (current.hasDual) {
            let pos2 = current.func(t, true);
            secondaryPoints.push(pos2);
        }

        fill(255);
        noStroke();
        ellipse(pos.x, pos.y, 8, 8);

        t += current.tSpeed;
    }
}

function resetSpiral() {
    let current = spirals[currentSpiralIndex];
    t = current.tRange[0];
    points = [];
    secondaryPoints = [];

    document.getElementById('spiral-title').innerText = current.title;
    document.getElementById('spiral-title').style.color = `rgb(${current.color.join(',')})`;
    document.getElementById('spiral-history').innerText = current.history;
    document.getElementById('spiral-formula').innerText = current.formula;
    document.getElementById('spiral-desc').innerText = current.desc;

    background(5, 5, 8);
}

function nextSpiral() {
    currentSpiralIndex = (currentSpiralIndex + 1) % spirals.length;
    resetSpiral();
}

function prevSpiral() {
    currentSpiralIndex = (currentSpiralIndex - 1 + spirals.length) % spirals.length;
    resetSpiral();
}

function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
    background(5, 5, 8);
}
</script>

</body>
</html>
